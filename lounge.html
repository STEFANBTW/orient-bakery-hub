<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orient Lounge | The Sound of Luxury</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary-gold': '#D4AF37',
                        'amber-premium': '#FFBF00',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        display: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes flow {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .gradient-flow {
            background: linear-gradient(270deg, #1a1a1a, #0d0d0d, #000000);
            background-size: 600% 600%;
            animation: flow 10s ease infinite;
        }

        .glass-amber {
            background: rgba(212, 175, 55, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .luxury-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px -12px rgba(212, 175, 55, 0.15);
            border-color: rgba(212, 175, 55, 0.3);
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(1deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        .float-anim {
            animation: float 8s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-black text-slate-100 font-sans selection:bg-primary-gold selection:text-black">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENTS ---

        const Nav = ({ page, setPage }) => (
            <nav className="fixed top-0 w-full z-50 h-24 flex items-center px-10 justify-between">
                <div className="flex items-center gap-4 cursor-pointer" onClick={() => setPage('HOME')}>
                    <div className="relative">
                        <span className="material-icons text-primary-gold text-4xl">liquor</span>
                        <div className="absolute inset-0 bg-primary-gold/30 blur-xl opacity-50"></div>
                    </div>
                    <div className="flex flex-col">
                        <span className="font-serif italic text-2xl font-bold tracking-tight text-white leading-none">Orient</span>
                        <span className="font-display text-[10px] tracking-[0.4em] text-primary-gold uppercase">Lounge</span>
                    </div>
                </div>
                <div className="hidden lg:flex items-center gap-14 glass-amber px-12 py-3 rounded-sm">
                    {['HOME', 'LAB', 'MENU', 'CONCIERGE'].map(item => (
                        <button
                            key={item}
                            onClick={() => setPage(item)}
                            className={`text-[10px] font-bold uppercase tracking-[0.3em] transition-all relative group ${page === item ? 'text-primary-gold' : 'text-slate-500 hover:text-white'}`}
                        >
                            {page === item && <span className="absolute -top-4 left-1/2 -translate-x-1/2 w-1 h-1 bg-primary-gold rounded-full shadow-[0_0_10px_#D4AF37]"></span>}
                            {item}
                        </button>
                    ))}
                </div>
                <div className="flex items-center gap-6">
                    <a href="index.html" className="w-12 h-12 glass-amber flex items-center justify-center text-primary-gold hover:bg-primary-gold/20 transition-all">
                        <span className="material-icons">architecture</span>
                    </a>
                    <button className="hidden md:block border border-primary-gold text-primary-gold px-8 py-3 rounded-sm text-[10px] uppercase font-bold tracking-[0.3em] hover:bg-primary-gold hover:text-black transition-all">Reservations</button>
                </div>
            </nav>
        );

        const Home = ({ setPage }) => (
            <div className="min-h-screen gradient-flow flex flex-col items-center justify-center text-center px-6 overflow-hidden">
                <div className="absolute inset-0 pointer-events-none opacity-40">
                    {[...Array(20)].map((_, i) => (
                        <div key={i} className="absolute bg-primary-gold/10 rounded-full blur-3xl" style={{ width: Math.random() * 400 + 100 + 'px', height: Math.random() * 400 + 100 + 'px', top: Math.random() * 100 + '%', left: Math.random() * 100 + '%' }}></div>
                    ))}
                </div>
                <div className="relative z-10 animate-fade-in max-w-5xl">
                    <span className="text-[10px] font-bold uppercase tracking-[0.6em] text-primary-gold/60 mb-8 block">Experience the Atmosphere</span>
                    <h1 className="font-display text-6xl md:text-9xl font-bold text-white mb-10 tracking-wider">AUDIO <br /><span className="text-white/20 italic font-serif tracking-tighter">&</span> SENSORY</h1>
                    <p className="text-xl md:text-2xl font-serif italic text-slate-400 max-w-2xl mx-auto mb-16 leading-relaxed opacity-80">"Where the quiet clinking of crystal meets the soft hum of Jos high-altitude evenings."</p>
                    <div className="flex flex-col sm:flex-row items-center justify-center gap-8">
                        <button onClick={() => setPage('MENU')} className="px-12 py-5 bg-primary-gold text-black font-bold uppercase tracking-widest text-[10px] rounded-sm hover:scale-105 active:scale-95 transition-all shadow-2xl">Browse Spirits</button>
                        <button onClick={() => setPage('LAB')} className="flex items-center gap-3 px-10 py-5 glass-amber text-white font-bold uppercase tracking-widest text-[10px] rounded-sm hover:bg-white/5 transition-all">
                            <span className="material-icons text-primary-gold">graphic_eq</span>
                            The Visualizer
                        </button>
                    </div>
                </div>
                <div className="absolute bottom-10 left-10 text-left border-l-2 border-primary-gold pl-6 py-2 opacity-50">
                    <p className="text-[10px] font-bold uppercase tracking-widest">Temperature</p>
                    <p className="text-lg font-display">18.4°C</p>
                </div>
            </div>
        );

        const Menu = () => (
            <div className="pt-48 pb-32 animate-fade-in px-10 max-w-7xl mx-auto">
                <header className="mb-24 flex justify-between items-end">
                    <div>
                        <h2 className="font-display text-6xl font-bold mb-4">THE CURATION</h2>
                        <div className="w-40 h-[1px] bg-primary-gold"></div>
                    </div>
                    <div className="text-right opacity-40 uppercase tracking-[0.3em] text-[10px] font-bold">Volume III &bull; Winter 2026</div>
                </header>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                    {[
                        { name: 'Plateau Smoked Negroni', price: '₦12,000', desc: 'Craft gin, campari, vermouth, cold-infused with mahogany wood smoke.' },
                        { name: 'Crystal Clear Zobo', price: '₦6,500', desc: 'Clarified hibiscus infusion, spiced with grains of paradise and local ginger.' },
                        { name: 'The Jos Highball', price: '₦15,000', desc: '18-year Single Malt topped with mountain-sourced spring water and citrus zest.' }
                    ].map((item, i) => (
                        <div key={i} className="glass-amber p-12 rounded-sm luxury-card transition-all group flex flex-col justify-between h-[400px]">
                            <div>
                                <h3 className="font-display text-2xl font-bold mb-6 group-hover:text-primary-gold transition-colors">{item.name}</h3>
                                <p className="text-slate-500 text-sm leading-relaxed mb-8">{item.desc}</p>
                            </div>
                            <div className="flex justify-between items-center border-t border-white/10 pt-8">
                                <span className="text-xl font-bold text-primary-gold">{item.price}</span>
                                <button className="w-10 h-10 rounded-full border border-primary-gold/30 flex items-center justify-center text-primary-gold hover:bg-primary-gold hover:text-black transition-all">
                                    <span className="material-icons text-sm">add</span>
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const Lab = () => (
            <div className="pt-32 pb-32 animate-fade-in px-10 flex flex-col items-center">
                <div className="w-full max-w-5xl aspect-video rounded-sm overflow-hidden border border-white/5 relative group cursor-crosshair">
                    <img src="https://images.unsplash.com/photo-1543791737-d910bc8bd1f0?w=1200&q=80" className="w-full h-full object-cover opacity-60 brightness-50" />
                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                        <div className="w-64 h-64 border-2 border-primary-gold/20 rounded-full flex items-center justify-center animate-pulse">
                            <div className="w-40 h-40 border-2 border-primary-gold/40 rounded-full flex items-center justify-center">
                                <div className="w-20 h-20 border-2 border-primary-gold rounded-full"></div>
                            </div>
                        </div>
                    </div>
                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                        <span className="font-display text-4xl font-bold text-primary-gold mb-6">AMBIENCE ENGINE_</span>
                        <p className="text-xs uppercase tracking-[0.5em] text-white/50">Frequency: 432Hz &bull; Intensity: Low</p>
                    </div>
                    <div className="absolute bottom-10 left-10 flex gap-4">
                        <div className="w-12 h-1 glass-amber overflow-hidden"><div className="w-1/2 h-full bg-primary-gold"></div></div>
                        <div className="w-12 h-1 glass-amber overflow-hidden"><div className="w-3/4 h-full bg-primary-gold"></div></div>
                        <div className="w-12 h-1 glass-amber overflow-hidden"><div className="w-1/4 h-full bg-primary-gold"></div></div>
                    </div>
                </div>
                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8 w-full max-w-5xl">
                    {['Calm', 'Dynamic', 'Vibrant', 'Ethereal'].map(mood => (
                        <button key={mood} className="py-4 glass-amber text-[10px] font-bold uppercase tracking-widest hover:bg-primary-gold hover:text-black transition-all">{mood}</button>
                    ))}
                </div>
            </div>
        );

        const Concierge = () => (
            <div className="pt-48 pb-32 px-10 animate-fade-in max-w-4xl mx-auto flex flex-col md:flex-row gap-16 items-center">
                <div className="w-full md:w-1/2">
                    <div className="relative h-[500px] w-full float-anim">
                        <img src="https://images.unsplash.com/photo-1551218808-94e220e03194?w=500&q=80" className="w-full h-full object-cover border border-primary-gold/20 rounded-sm" />
                        <div className="absolute -inset-4 border border-primary-gold/10 -z-10 animate-pulse"></div>
                    </div>
                </div>
                <div className="w-full md:w-1/2">
                    <span className="text-primary-gold text-[10px] font-bold uppercase tracking-[0.4em] mb-4 block">Digital Concierge</span>
                    <h2 className="font-display text-5xl font-bold mb-8 italic">Your Private <br /><span className="text-white">Experience.</span></h2>
                    <p className="text-slate-500 font-serif text-lg leading-relaxed mb-10">Access exclusive seating, pre-order rare vintages, and customize your cabin’s audio profile before you even arrive.</p>
                    <div className="space-y-4">
                        <button className="w-full py-5 glass-amber flex justify-between px-8 items-center group">
                            <span className="text-[10px] font-bold uppercase tracking-widest">Connect Wallet</span>
                            <span className="material-icons group-hover:translate-x-2 transition-transform">arrow_forward</span>
                        </button>
                        <button className="w-full py-5 glass-amber flex justify-between px-8 items-center group">
                            <span className="text-[10px] font-bold uppercase tracking-widest">Member Portal</span>
                            <span className="material-icons group-hover:translate-x-2 transition-transform">arrow_forward</span>
                        </button>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [page, setPage] = useState('HOME');
            useEffect(() => { window.scrollTo(0, 0); }, [page]);

            return (
                <div className="min-h-screen">
                    <Nav page={page} setPage={setPage} />
                    <main>
                        {page === 'HOME' && <Home setPage={setPage} />}
                        {page === 'MENU' && <Menu />}
                        {page === 'LAB' && <Lab />}
                        {page === 'CONCIERGE' && <Concierge />}
                    </main>
                    <footer className="py-20 text-slate-700 text-[9px] font-bold uppercase tracking-[0.6em] text-center border-t border-white/5">
                        &copy; 2026 Orient Lounge &bull; Plateu High Altitude
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
