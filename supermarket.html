<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orient Supermarket Suite | Smart Commerce</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#FF6A00',
                        brand: {
                            900: '#0F172A',
                            800: '#1E293B',
                        }
                    },
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .grid-isometric {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card-neo {
            background: white;
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .card-neo:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.03);
            border-color: #FF6A00;
        }

        .dark .card-neo {
            background: #1a1a1a;
            border-color: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body class="bg-gray-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Nav = ({ page, setPage }) => (
            <nav className="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-[100] shadow-md">
                <div className="max-w-[1600px] mx-auto px-6 h-16 flex items-center justify-between">
                    <div className="flex items-center gap-2 cursor-pointer" onClick={() => setPage('STORE')}>
                        <span className="material-icons text-primary">api</span>
                        <span className="font-bold tracking-tight text-lg">Orient<span className="font-light text-slate-400">Suite</span></span>
                    </div>
                    <div className="hidden lg:flex items-center gap-2 flex-1 mx-10 overflow-x-auto no-scrollbar">
                        {['STORE', 'PRODUCE', 'DEALS', 'WHOLESALE', 'DASHBOARD'].map(item => (
                            <button
                                key={item}
                                onClick={() => setPage(item)}
                                className={`px-4 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest transition-all whitespace-nowrap ${page === item ? 'bg-white text-slate-900' : 'text-slate-400 hover:text-white'}`}
                            >
                                {item}
                            </button>
                        ))}
                    </div>
                    <div className="flex items-center gap-6">
                        <div className="flex items-center gap-2 text-primary font-bold text-xs cursor-pointer">
                            <span className="material-icons text-sm">shopping_cart</span>
                            <span>SMART CART</span>
                        </div>
                        <a href="index.html" className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 hover:text-white transition-all">
                            <span className="material-icons text-sm">apps</span>
                        </a>
                    </div>
                </div>
            </nav>
        );

        const Storefront = () => (
            <div className="animate-fade-in p-8 lg:p-12">
                <header className="mb-16">
                    <h1 className="text-4xl font-bold mb-4">Good morning, <span className="text-primary italic font-light">Shopper.</span></h1>
                    <div className="relative max-w-2xl">
                        <span className="material-icons absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">search</span>
                        <input className="w-full bg-white dark:bg-slate-900 p-5 pl-14 rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-primary outline-none" placeholder="Search for groceries, meals, or wholesale items..." />
                    </div>
                </header>

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-16">
                    <div className="lg:col-span-2 relative h-[400px] rounded-[2.5rem] overflow-hidden group">
                        <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=1200&q=80" className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                        <div className="absolute inset-0 bg-gradient-to-r from-slate-900/90 to-transparent flex flex-col justify-center px-12 text-white">
                            <span className="text-xs font-bold uppercase tracking-[0.3em] text-primary mb-4">Fresh Arrival</span>
                            <h2 className="text-5xl font-bold mb-6 max-w-md leading-tight">THE PRODUCE MASTERCLASS.</h2>
                            <p className="max-w-xs text-slate-300 mb-8">Directly sourced from Nigerian soil. Organic, crisp, and vibrant.</p>
                            <button className="bg-primary hover:bg-white hover:text-primary transition-all px-8 py-3 rounded-xl font-bold text-xs uppercase tracking-widest self-start">Shop Now</button>
                        </div>
                    </div>
                    <div className="bg-primary/10 rounded-[2.5rem] p-10 flex flex-col justify-between overflow-hidden relative">
                        <div className="relative z-10">
                            <h3 className="text-3xl font-bold mb-4">BOGOF_</h3>
                            <p className="text-slate-500 font-medium">Buy one, get one free on all bakery items today only.</p>
                        </div>
                        <div className="w-48 h-48 bg-primary rounded-full absolute -bottom-10 -right-10 blur-3xl opacity-20"></div>
                        <div className="relative z-10">
                            <button className="text-primary font-bold uppercase tracking-widest text-[10px] flex items-center gap-2">View Deals <span className="material-icons text-sm">arrow_forward</span></button>
                        </div>
                    </div>
                </div>

                <div className="grid-isometric">
                    {[
                        { name: 'Fresh Avocado', img: 'https://images.unsplash.com/photo-1519162808019-7de1683fa2ad?w=400&q=80', price: '₦1,200', tag: 'Fresh' },
                        { name: 'Whole Wheat Bread', img: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=400&q=80', price: '₦800', tag: 'Bakery' },
                        { name: 'Organic Honey', img: 'https://images.unsplash.com/photo-1558642452-9d2a7deb7f62?w=400&q=80', price: '₦4,500', tag: 'Pantry' },
                        { name: 'Imported Berries', img: 'https://images.unsplash.com/photo-1518635017498-87f514b751ba?w=400&q=80', price: '₦3,800', tag: 'Fruit' },
                    ].map((p, i) => (
                        <div key={i} className="card-neo p-6 rounded-[2rem]">
                            <div className="h-56 bg-slate-50 dark:bg-slate-800 rounded-2xl mb-6 overflow-hidden">
                                <img src={p.img} className="w-full h-full object-cover" />
                            </div>
                            <span className="text-[10px] uppercase font-bold text-slate-400 tracking-widest mb-1 block">{p.tag}</span>
                            <h4 className="font-bold text-lg mb-4">{p.name}</h4>
                            <div className="flex justify-between items-center pt-4 border-t border-slate-50 dark:border-white/5">
                                <span className="font-bold text-primary">{p.price}</span>
                                <button className="w-10 h-10 bg-slate-900 dark:bg-white text-white dark:text-black rounded-full flex items-center justify-center hover:scale-110 transition-all">
                                    <span className="material-icons text-sm">add_shopping_cart</span>
                                </button>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const Wholesale = () => (
            <div className="p-12 animate-fade-in max-w-7xl mx-auto">
                <header className="mb-16">
                    <h2 className="text-5xl font-bold tracking-tighter mb-4 italic">Bulk Operations_</h2>
                    <p className="text-slate-500 max-w-xl">B2B Logistic fulfillment for industrial kitchens and hospitality giants.</p>
                </header>
                <div className="space-y-6">
                    {[
                        { title: 'Jumbo Egg Crate', qty: '30 Dozen', price: '₦45,000' },
                        { title: 'Chef Special Flour', qty: '50kg Bag', price: '₦32,000' },
                        { title: 'Vegetable Oil', qty: '20L Keg', price: '₦28,500' }
                    ].map((item, i) => (
                        <div key={i} className="card-neo p-10 rounded-2xl flex items-center justify-between group">
                            <div className="flex items-center gap-10">
                                <span className="text-xs font-bold text-slate-300 font-mono">0{i + 1}</span>
                                <div>
                                    <h4 className="font-bold text-xl group-hover:text-primary transition-all">{item.title}</h4>
                                    <p className="text-xs text-slate-400 uppercase tracking-widest mt-1">{item.qty}</p>
                                </div>
                            </div>
                            <div className="text-right">
                                <p className="text-2xl font-bold mb-4">{item.price}</p>
                                <button className="bg-slate-900 dark:bg-white text-white dark:text-black px-6 py-2 rounded-lg text-[10px] font-bold uppercase tracking-widest">Order Bulk</button>
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        );

        const Dashboard = () => (
            <div className="p-12 animate-fade-in grid grid-cols-1 lg:grid-cols-4 gap-8">
                <div className="lg:col-span-3 space-y-8">
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                        <div className="card-neo p-8 rounded-[2rem]">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Loyalty Points</p>
                            <h3 className="text-4xl font-bold text-primary">24,500</h3>
                        </div>
                        <div className="card-neo p-8 rounded-[2rem]">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Total Savings</p>
                            <h3 className="text-4xl font-bold text-emerald-500">₦12.5k</h3>
                        </div>
                        <div className="card-neo p-8 rounded-[2rem]">
                            <p className="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Member Tier</p>
                            <h3 className="text-4xl font-bold text-brand-900 dark:text-white uppercase italic">Elite</h3>
                        </div>
                    </div>
                    <div className="card-neo p-10 rounded-[2.5rem] h-[400px]">
                        <h4 className="text-xl font-bold mb-8">Purchase Velocity_</h4>
                        <div className="w-full h-full bg-slate-50 dark:bg-slate-900/50 rounded-2xl flex items-center justify-center">
                            <span className="text-xs text-slate-400 uppercase tracking-widest font-bold font-mono text-center">Chart visualization <br />under construction</span>
                        </div>
                    </div>
                </div>
                <div className="space-y-8">
                    <div className="card-neo p-8 rounded-[2rem]">
                        <h4 className="font-bold mb-6 flex items-center gap-2">
                            <span className="material-icons text-primary text-sm">receipt</span>
                            Last Receipts
                        </h4>
                        <div className="space-y-4">
                            {[12, 5, 22].map(d => (
                                <div key={d} className="flex justify-between items-center p-3 hover:bg-slate-50 dark:hover:bg-slate-900 rounded-xl transition-all cursor-pointer">
                                    <span className="text-xs font-medium">Inv_#459{d}</span>
                                    <span className="text-xs font-mono text-slate-400">Feb {d}, 2026</span>
                                </div>
                            ))}
                        </div>
                    </div>
                    <div className="card-neo p-8 rounded-[2rem] bg-slate-900 text-white border-none">
                        <h4 className="font-bold mb-4">Smart Upgrade</h4>
                        <p className="text-xs opacity-60 mb-6">Unlock predictive shopping lists and automated checkout for just ₦4,000/mo.</p>
                        <button className="w-full py-3 bg-white text-black font-bold rounded-xl text-[10px] uppercase tracking-widest">Upgrade Now</button>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [page, setPage] = useState('STORE');
            useEffect(() => { window.scrollTo(0, 0); }, [page]);

            return (
                <div className="min-h-screen">
                    <Nav page={page} setPage={setPage} />
                    <main>
                        {page === 'STORE' && <Storefront />}
                        {page === 'WHOLESALE' && <Wholesale />}
                        {page === 'DASHBOARD' && <Dashboard />}
                        {(page === 'PRODUCE' || page === 'DEALS') && (
                            <div className="p-32 text-center">
                                <span className="material-icons text-6xl text-slate-200 mb-6">construction</span>
                                <h3 className="text-2xl font-bold mb-4">{page} MODULE_</h3>
                                <p className="text-slate-400 max-w-xs mx-auto">This specialized section is being ported to the new unified architecture. Please check back shortly.</p>
                                <button onClick={() => setPage('STORE')} className="mt-10 text-primary font-bold uppercase tracking-widest text-[10px]">Back to Storefront</button>
                            </div>
                        )}
                    </main>
                    <footer className="py-20 text-slate-400 text-[10px] font-bold uppercase tracking-[0.4em] text-center">
                        &copy; 2026 Orient Supermarket Suite &bull; Smart Infrastructure
                    </footer>
                </div>
            )
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
