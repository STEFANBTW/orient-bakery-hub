<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orient Games</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              "display": ["Space Grotesk", "sans-serif"],
              "tech": ["Orbitron", "sans-serif"],
            },
            animation: {
                'glitch': 'glitch 1s linear infinite',
                'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                'pulse-glow': 'pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                'scanline': 'scanline 8s linear infinite',
                'float': 'float 6s ease-in-out infinite',
                'spin-slow': 'spin 10s linear infinite',
            },
            keyframes: {
                glitch: {
                    '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                    '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                    '62%': { transform: 'translate(0,0) skew(5deg)' },
                },
                scanline: {
                    '0%': { backgroundPosition: '0 0' },
                    '100%': { backgroundPosition: '0 100%' },
                },
                float: {
                    '0%, 100%': { transform: 'translateY(0)' },
                    '50%': { transform: 'translateY(-20px)' },
                },
                'pulse-glow': {
                    '0%, 100%': { opacity: '1', boxShadow: '0 0 15px currentColor' },
                    '50%': { opacity: '.8', boxShadow: '0 0 5px currentColor' },
                }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #000;
        color: white;
      }
      /* Global Utilities */
      .hide-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .hide-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      /* Scanlines */
      .scanlines {
        background: linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,0) 50%,
            rgba(0,0,0,0.1) 50%,
            rgba(0,0,0,0.1)
        );
        background-size: 100% 4px;
        pointer-events: none;
      }

      /* VR Page Utilities */
      .vr-scroll::-webkit-scrollbar {
          width: 8px;
      }
      .vr-scroll::-webkit-scrollbar-track {
          background: #102222; 
      }
      .vr-scroll::-webkit-scrollbar-thumb {
          background: #0df2f2; 
          border-radius: 4px;
      }
      .glitch-wrapper {
          position: relative;
      }
      .glitch-wrapper::before,
      .glitch-wrapper::after {
          content: attr(data-text);
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          opacity: 0.8;
      }
      .glitch-wrapper::before {
          animation: glitch 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
          color: #0df2f2;
          z-index: -1;
      }
      .glitch-wrapper::after {
          animation: glitch 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) reverse both infinite;
          color: #ff00ff;
          z-index: -2;
      }
      .tech-grid {
          background-image: linear-gradient(to right, #0df2f2 1px, transparent 1px), linear-gradient(to bottom, #0df2f2 1px, transparent 1px);
          background-size: 40px 40px;
          mask-image: linear-gradient(to bottom, transparent, black, transparent);
          -webkit-mask-image: linear-gradient(to bottom, transparent 5%, black 40%, black 70%, transparent 95%);
      }

      /* Tournament Scrollbar */
      .tourney-scroll::-webkit-scrollbar {
            width: 8px;
        }
      .tourney-scroll::-webkit-scrollbar-track {
            background: #101622;
        }
      .tourney-scroll::-webkit-scrollbar-thumb {
            background: #135bec;
            border-radius: 4px;
        }
      .glass {
            background: rgba(16, 22, 34, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(19, 91, 236, 0.1);
      }
      .bracket-line {
            stroke: #334155;
            stroke-width: 2;
            fill: none;
      }
      .bracket-line.active {
            stroke: #135bec;
            filter: drop-shadow(0 0 4px #135bec);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "framer-motion": "https://esm.sh/framer-motion@^12.34.0"
  }
}
</script>

</head>

    <div id="root"></div>

</html>
