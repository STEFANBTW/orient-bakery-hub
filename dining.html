<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orient Dining | A Culinary Journey</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#EC6D13',
                        background: {
                            light: '#FDFCFB',
                            dark: '#0A0A0A',
                        }
                    },
                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-sans selection:bg-primary selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- COMPONENTS ---

        const Navigation = ({ view, setView }) => {
            const [scrolled, setScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-white/80 dark:bg-black/80 backdrop-blur-xl py-4 shadow-xl border-b border-white/5' : 'bg-transparent py-8'}`}>
                    <div className="max-w-7xl mx-auto px-8 flex justify-between items-center">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('about')}>
                            <div className="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white shadow-lg shadow-primary/20">
                                <span className="material-icons text-sm">restaurant</span>
                            </div>
                            <span className="font-display text-2xl font-bold tracking-tight">Orient.</span>
                        </div>
                        <div className="hidden md:flex items-center gap-10">
                            {['about', 'menu', 'sommelier', 'reservations'].map(item => (
                                <button
                                    key={item}
                                    onClick={() => setView(item)}
                                    className={`text-[10px] font-bold uppercase tracking-[0.3em] transition-all ${view === item ? 'text-primary' : 'text-slate-400 hover:text-slate-900 dark:hover:text-white'}`}
                                >
                                    {item}
                                </button>
                            ))}
                        </div>
                        <div className="flex items-center gap-4">
                            <a href="index.html" className="w-10 h-10 border border-slate-200 dark:border-white/10 rounded-full flex items-center justify-center hover:bg-primary hover:text-white hover:border-primary transition-all">
                                <span className="material-icons text-sm">apps</span>
                            </a>
                            <button className="bg-primary text-white px-6 py-2 rounded-full text-[10px] font-bold uppercase tracking-widest hover:scale-105 active:scale-95 transition-all shadow-lg shadow-primary/20">
                                Book Now
                            </button>
                        </div>
                    </div>
                </nav>
            );
        };

        const About = () => (
            <div className="animate-fade-in">
                <header className="relative h-screen flex flex-col items-center justify-center text-center px-8 overflow-hidden">
                    <div className="absolute inset-0 z-0">
                        <img src="https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?w=1600&q=80" className="w-full h-full object-cover brightness-50" />
                        <div className="absolute inset-0 bg-gradient-to-t from-background-dark via-transparent to-transparent"></div>
                    </div>
                    <div className="relative z-10 max-w-4xl">
                        <span className="text-primary font-bold tracking-[0.4em] uppercase text-[10px] mb-8 block animate-fade-in">Established 2024 &bull; Lagos</span>
                        <h1 className="font-display text-7xl md:text-9xl font-bold text-white mb-8 leading-tight animate-fade-in" style={{ animationDelay: '0.2s' }}>
                            Taste the <br /><span className="italic font-light text-primary">Orient</span>
                        </h1>
                        <p className="text-xl md:text-2xl text-slate-300 font-light max-w-2xl mx-auto leading-relaxed animate-fade-in" style={{ animationDelay: '0.4s' }}>
                            A culinary journey from the vibrant markets of Jos to the heart of fine dining.
                        </p>
                    </div>
                </header>
                <section className="py-32 bg-background-light dark:bg-background-dark">
                    <div className="max-w-7xl mx-auto px-8 grid grid-cols-1 md:grid-cols-2 gap-20 items-center">
                        <div className="relative h-[600px] rounded-[3rem] overflow-hidden shadow-2xl">
                            <img src="https://images.unsplash.com/photo-1559339352-11d035aa65de?w=800&q=80" className="w-full h-full object-cover" />
                        </div>
                        <div>
                            <h2 className="font-display text-5xl font-bold mb-8">Heritage & Harvest</h2>
                            <p className="text-slate-500 text-lg mb-8 leading-relaxed">We source our ingredients from the rich volcanic soil of the Plateau state, ensuring every dish carries the soul of the Nigerian heritage with a modern continental twist.</p>
                            <div className="grid grid-cols-2 gap-8">
                                <div>
                                    <h4 className="font-bold text-3xl text-primary mb-2">100%</h4>
                                    <p className="text-xs uppercase tracking-widest text-slate-400 font-bold">Organic Sourcing</p>
                                </div>
                                <div>
                                    <h4 className="font-bold text-3xl text-primary mb-2">24h</h4>
                                    <p className="text-xs uppercase tracking-widest text-slate-400 font-bold">Farm to Fork</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        );

        const Menu = () => {
            const items = [
                { title: 'Egusi & Pounded Yam', price: '₦8,500', cat: 'Local', img: 'https://images.unsplash.com/photo-1621451537084-482c73073a0f?w=400&q=80' },
                { title: 'Prime Ribeye Steak', price: '₦22,000', cat: 'Continental', img: 'https://images.unsplash.com/photo-1544025162-d76694265947?w=400&q=80' },
                { title: 'Amala & Ewedu', price: '₦7,500', cat: 'Local', img: 'https://images.unsplash.com/photo-1604329760661-e71dc7010127?w=400&q=80' },
                { title: 'Truffle Alfredo', price: '₦14,000', cat: 'Continental', img: 'https://images.unsplash.com/photo-1563729784474-d77dbb933a9e?w=400&q=80' },
            ];

            return (
                <div className="pt-40 pb-32 animate-fade-in px-8">
                    <div className="max-w-7xl mx-auto">
                        <header className="text-center mb-24">
                            <h2 className="font-display text-6xl font-bold mb-6">The Collective Menu</h2>
                            <div className="w-24 h-1 bg-primary mx-auto"></div>
                        </header>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                            {items.map((item, i) => (
                                <div key={i} className="group cursor-pointer">
                                    <div className="h-80 rounded-[2rem] overflow-hidden mb-6 relative">
                                        <img src={item.img} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" />
                                        <div className="absolute top-4 right-4 bg-white/10 backdrop-blur-md border border-white/20 px-3 py-1 rounded-full text-[8px] font-bold uppercase tracking-widest text-white">
                                            {item.cat}
                                        </div>
                                    </div>
                                    <h3 className="font-display text-2xl font-bold mb-1 group-hover:text-primary transition-all">{item.title}</h3>
                                    <p className="text-primary font-bold">{item.price}</p>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const Sommelier = () => (
            <div className="pt-48 pb-32 animate-fade-in px-8 max-w-4xl mx-auto">
                <div className="bg-slate-50 dark:bg-white/5 p-16 rounded-[4rem] border border-slate-100 dark:border-white/5 relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-64 h-64 bg-primary/5 rounded-full blur-3xl -mr-32 -mt-32"></div>
                    <div className="relative z-10">
                        <div className="flex items-center gap-3 mb-10">
                            <div className="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                            <span className="text-[10px] font-bold uppercase tracking-[0.3em] text-slate-400">AI Concierge active</span>
                        </div>
                        <h2 className="font-display text-5xl font-bold mb-8">Precision Pairing.</h2>
                        <div className="bg-white dark:bg-black/40 p-10 rounded-3xl border border-slate-100 dark:border-white/5 mb-10">
                            <p className="text-lg italic text-slate-500 dark:text-slate-400 leading-relaxed font-serif">"I noticed you're exploring the Ribeye. May I suggest the 2018 Cabernet Sauvignon? Its bold tannins harmonize beautifully with our Jos-harvested beef fat."</p>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <button className="bg-slate-900 dark:bg-white dark:text-black text-white p-6 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-primary transition-all">Accept Pairing</button>
                            <button className="border border-slate-200 dark:border-white/10 p-6 rounded-2xl font-bold text-xs uppercase tracking-widest hover:bg-slate-100 dark:hover:bg-white/5 transition-all">Show Alternatives</button>
                        </div>
                    </div>
                </div>
            </div>
        );

        const Reservations = () => (
            <div className="pt-48 pb-48 animate-fade-in px-8 max-w-xl mx-auto text-center">
                <h2 className="font-display text-5xl font-bold mb-8 italic">Securing your seat.</h2>
                <div className="space-y-6">
                    <input className="w-full bg-slate-50 dark:bg-white/5 p-6 rounded-2xl border-none focus:ring-2 focus:ring-primary outline-none" placeholder="Desired Date" type="date" />
                    <input className="w-full bg-slate-50 dark:bg-white/5 p-6 rounded-2xl border-none focus:ring-2 focus:ring-primary outline-none" placeholder="Number of Guests" type="number" />
                    <button className="w-full bg-primary text-white p-6 rounded-2xl font-bold uppercase tracking-widest hover:shadow-2xl shadow-primary/20 transition-all">Request Table</button>
                </div>
            </div>
        );

        const App = () => {
            const [view, setView] = useState('about');
            useEffect(() => { window.scrollTo(0, 0); }, [view]);

            return (
                <div className="min-h-screen">
                    <Navigation view={view} setView={setView} />
                    <main>
                        {view === 'about' && <About />}
                        {view === 'menu' && <Menu />}
                        {view === 'sommelier' && <Sommelier />}
                        {view === 'reservations' && <Reservations />}
                    </main>
                    <footer className="py-20 bg-slate-900 text-slate-500 text-[10px] font-bold uppercase tracking-[0.5em] text-center border-t border-white/5">
                        &copy; 2026 Orient Culinary Boutique &bull; Plateu State
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
