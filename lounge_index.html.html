
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orient Lounge - The Sound of Luxury</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Manrope:wght@200;300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f2b90d",
                        "primary-gold": "#d4af35",
                        "background-dark": "#0a0a0c",
                        "surface-dark": "#121212",
                        "tobacco-dark": "#1a160e",
                        "noir-black": "#050505",
                        "leather": "#1a1610",
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"],
                        "serif": ["Playfair Display", "serif"],
                        "manrope": ["Manrope", "sans-serif"],
                        "newsreader": ["Newsreader", "serif"],
                        "inter": ["Inter", "sans-serif"]
                    },
                    animation: {
                        'page-enter': 'page-enter 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    }
                },
            },
        }
    </script>
    <style>
        /* Page Transition Animation */
        @keyframes page-enter {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.995);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .page-transition {
            animation: page-enter 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            will-change: transform, opacity;
        }

        /* Existing Animations */
        @keyframes pulse-height {
            0%, 100% { height: 20%; opacity: 0.3; }
            50% { height: 80%; opacity: 1; }
        }
        .waveform-bar {
            animation: pulse-height 2s infinite ease-in-out;
        }
        .waveform-bar:nth-child(odd) { animation-duration: 1.5s; }
        .waveform-bar:nth-child(2n) { animation-duration: 1.8s; }
        .waveform-bar:nth-child(3n) { animation-duration: 2.2s; }
        .waveform-bar:nth-child(4n) { animation-duration: 1.2s; }

        @keyframes wave {
            0%, 100% { height: 10%; }
            50% { height: 100%; }
        }
        .bar { animation: wave 1s ease-in-out infinite; }
        .bar:nth-child(odd) { animation-duration: 0.8s; }
        .bar:nth-child(2n) { animation-duration: 1.1s; }
        .bar:nth-child(3n) { animation-duration: 1.3s; }
        .bar:nth-child(4n) { animation-duration: 0.9s; }

        @keyframes drift {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.4; }
            100% { transform: translateY(-100px) translateX(20px); opacity: 0; }
        }
        .smoke-particle { animation: drift 8s infinite ease-out; }

        /* New Animation for Hero Images - High Visibility */
        @keyframes hero-pan {
            0% { transform: scale(1.05); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .glass-nav {
            background: rgba(10, 10, 10, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(242, 185, 13, 0.1);
        }

        .iso-card {
            transform: perspective(1000px) rotateX(20deg) rotateY(-10deg) rotateZ(2deg);
            transition: transform 0.5s ease;
        }
        .iso-card:hover {
            transform: perspective(1000px) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1.02);
            z-index: 10;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-dark text-white selection:bg-primary selection:text-black">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
